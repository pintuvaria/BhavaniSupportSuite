<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181824"/>
      <stop offset="100%" style="stop-color:#1E1E2E"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADB5"/>
      <stop offset="50%" style="stop-color:#00CED1"/>
      <stop offset="100%" style="stop-color:#00ADB5"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="50" fill="url(#bg5)"/>
  <!-- Geometric "B" Shape -->
  <g transform="translate(256,220)" filter="url(#glow5)">
    <!-- Left vertical bar -->
    <rect x="-120" y="-140" width="40" height="280" rx="8" fill="url(#accent5)"/>
    <!-- Top horizontal bar -->
    <rect x="-80" y="-140" width="140" height="35" rx="8" fill="url(#accent5)"/>
    <!-- Middle horizontal bar -->
    <rect x="-80" y="-30" width="120" height="35" rx="8" fill="url(#accent5)"/>
    <!-- Bottom horizontal bar -->
    <rect x="-80" y="105" width="140" height="35" rx="8" fill="url(#accent5)"/>
    <!-- Top curve -->
    <path d="M60 -105 Q120 -105 120 -22 Q120 60 60 60" fill="none" stroke="url(#accent5)" stroke-width="35" stroke-linecap="round"/>
    <!-- Bottom curve -->
    <path d="M60 35 Q120 35 120 112 Q120 145 60 145" fill="none" stroke="url(#accent5)" stroke-width="35" stroke-linecap="round"/>
  </g>
  <!-- Circuit Decorations -->
  <g stroke="#00ADB540" stroke-width="2" fill="none">
    <line x1="60" y1="100" x2="60" y2="180"/>
    <line x1="60" y1="140" x2="100" y2="140"/>
    <line x1="452" y1="100" x2="452" y2="180"/>
    <line x1="452" y1="140" x2="412" y2="140"/>
    <line x1="60" y1="340" x2="60" y2="420"/>
    <line x1="60" y1="380" x2="100" y2="380"/>
    <line x1="452" y1="340" x2="452" y2="420"/>
    <line x1="452" y1="380" x2="412" y2="380"/>
  </g>
  <circle cx="100" cy="140" r="5" fill="#00ADB5"/>
  <circle cx="412" cy="140" r="5" fill="#00ADB5"/>
  <circle cx="100" cy="380" r="5" fill="#00ADB5"/>
  <circle cx="412" cy="380" r="5" fill="#00ADB5"/>
  <!-- Bottom Text -->
  <text x="256" y="440" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#00ADB5">BHAVANI</text>
  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#888888">SUPPORT SUITE PRO</text>
</svg>
