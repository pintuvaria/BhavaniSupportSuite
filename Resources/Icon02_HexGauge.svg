<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181824"/>
      <stop offset="100%" style="stop-color:#1E1E2E"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ADB5"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagon Background -->
  <polygon points="256,40 456,150 456,370 256,480 56,370 56,150" 
           fill="url(#bg2)" stroke="url(#accent2)" stroke-width="4"/>
  <!-- Inner Hexagon -->
  <polygon points="256,100 400,180 400,340 256,420 112,340 112,180" 
           fill="none" stroke="#00ADB530" stroke-width="2"/>
  <!-- Gauge Arc -->
  <path d="M160 300 A120 120 0 0 1 352 300" fill="none" stroke="#2A2A3C" stroke-width="20" stroke-linecap="round"/>
  <path d="M160 300 A120 120 0 0 1 320 180" fill="none" stroke="url(#accent2)" stroke-width="20" stroke-linecap="round" filter="url(#glow2)"/>
  <!-- Gauge Needle -->
  <line x1="256" y1="300" x2="290" y2="200" stroke="#00ADB5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="300" r="12" fill="#00ADB5"/>
  <!-- Gauge Labels -->
  <text x="140" y="340" font-family="Segoe UI" font-size="16" fill="#888888">0</text>
  <text x="350" y="340" font-family="Segoe UI" font-size="16" fill="#888888">100</text>
  <text x="256" y="280" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#00ADB5">87%</text>
  <!-- Top Icon - Monitor -->
  <rect x="210" y="100" width="92" height="65" rx="6" fill="none" stroke="#00ADB5" stroke-width="3"/>
  <rect x="240" y="165" width="32" height="10" fill="#00ADB5"/>
  <rect x="230" y="175" width="52" height="5" rx="2" fill="#00ADB5"/>
  <!-- Monitor Screen Content -->
  <line x1="220" y1="120" x2="250" y2="120" stroke="#00ADB560" stroke-width="2"/>
  <line x1="220" y1="130" x2="270" y2="130" stroke="#00ADB560" stroke-width="2"/>
  <line x1="220" y1="140" x2="260" y2="140" stroke="#00ADB560" stroke-width="2"/>
  <!-- Bottom Text -->
  <text x="256" y="460" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="bold" fill="#00ADB5">BHAVANI</text>
</svg>
