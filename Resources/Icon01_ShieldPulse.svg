<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181824"/>
      <stop offset="100%" style="stop-color:#222232"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADB5"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg1)" stroke="url(#accent1)" stroke-width="4"/>
  <!-- Shield Shape -->
  <path d="M256 80 L380 140 L380 280 Q380 380 256 432 Q132 380 132 280 L132 140 Z" 
        fill="none" stroke="url(#accent1)" stroke-width="6" filter="url(#glow1)"/>
  <!-- Circuit Lines -->
  <path d="M256 120 L256 200 M200 180 L256 200 M312 180 L256 200" 
        stroke="#00ADB5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Center Pulse -->
  <circle cx="256" cy="260" r="40" fill="none" stroke="#00ADB5" stroke-width="3"/>
  <circle cx="256" cy="260" r="25" fill="none" stroke="#00CED1" stroke-width="2"/>
  <circle cx="256" cy="260" r="10" fill="#00ADB5"/>
  <!-- Pulse Wave Lines -->
  <path d="M180 260 L220 260 L235 230 L250 290 L265 230 L280 290 L295 260 L332 260" 
        stroke="#00ADB5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner Nodes -->
  <circle cx="170" cy="340" r="6" fill="#00ADB5"/>
  <circle cx="342" cy="340" r="6" fill="#00ADB5"/>
  <circle cx="256" cy="380" r="6" fill="#00ADB5"/>
  <!-- Connecting Lines -->
  <line x1="170" y1="340" x2="256" y2="380" stroke="#00ADB540" stroke-width="2"/>
  <line x1="342" y1="340" x2="256" y2="380" stroke="#00ADB540" stroke-width="2"/>
  <!-- Text -->
  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="bold" fill="#00ADB5">BSS PRO</text>
</svg>
