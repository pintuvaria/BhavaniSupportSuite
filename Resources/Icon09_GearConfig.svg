<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181824"/>
      <stop offset="100%" style="stop-color:#1E1E2E"/>
    </linearGradient>
    <linearGradient id="accent9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADB5"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg9)"/>
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2A2A3C" stroke-width="6"/>
  <!-- Gear Teeth - Outer -->
  <g fill="#00ADB5" filter="url(#glow9)">
    <rect x="250" y="40" width="12" height="30" rx="4"/>
    <rect x="250" y="442" width="12" height="30" rx="4"/>
    <rect x="40" y="250" width="30" height="12" rx="4"/>
    <rect x="442" y="250" width="30" height="12" rx="4"/>
    <!-- Diagonal teeth -->
    <rect x="250" y="40" width="12" height="30" rx="4" transform="rotate(45 256 256)"/>
    <rect x="250" y="442" width="12" height="30" rx="4" transform="rotate(45 256 256)"/>
    <rect x="40" y="250" width="30" height="12" rx="4" transform="rotate(45 256 256)"/>
    <rect x="442" y="250" width="30" height="12" rx="4" transform="rotate(45 256 256)"/>
    <rect x="250" y="40" width="12" height="30" rx="4" transform="rotate(-45 256 256)"/>
    <rect x="250" y="442" width="12" height="30" rx="4" transform="rotate(-45 256 256)"/>
    <rect x="40" y="250" width="30" height="12" rx="4" transform="rotate(-45 256 256)"/>
    <rect x="442" y="250" width="30" height="12" rx="4" transform="rotate(-45 256 256)"/>
  </g>
  <!-- Main Gear Circle -->
  <circle cx="256" cy="256" r="140" fill="#222232" stroke="url(#accent9)" stroke-width="5"/>
  <!-- Inner Gear Circle -->
  <circle cx="256" cy="256" r="100" fill="#181824" stroke="#00ADB540" stroke-width="3"/>
  <!-- Center Hub -->
  <circle cx="256" cy="256" r="40" fill="url(#accent9)"/>
  <circle cx="256" cy="256" r="25" fill="#181824"/>
  <!-- Radiating Lines from Center -->
  <g stroke="#00ADB5" stroke-width="2" opacity="0.6">
    <line x1="256" y1="216" x2="256" y2="160"/>
    <line x1="256" y1="296" x2="256" y2="352"/>
    <line x1="216" y1="256" x2="160" y2="256"/>
    <line x1="296" y1="256" x2="352" y2="256"/>
  </g>
  <!-- Center Bolt -->
  <circle cx="256" cy="256" r="12" fill="#00CED1"/>
  <!-- Labels around gear -->
  <text x="256" y="180" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">CONFIG</text>
  <text x="256" y="340" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">SYSTEM</text>
  <text x="180" y="260" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">TOOLS</text>
  <text x="332" y="260" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">UTILS</text>
  <!-- Bottom Text -->
  <text x="256" y="480" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="#00ADB5">CONFIGURE</text>
</svg>
